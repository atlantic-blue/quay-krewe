<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow map</title>
<style>
/* The chrome: the map's own furniture. It keeps one palette whatever the project is, so the
   project's colours are only ever the ones inside a screen. Nothing here names .frame, .bezel,
   .chrome or .screen, and a test holds that line. */
:root{
  --ground:#eceae6; --dot:#d8d4ce; --panel:#fbfaf8; --panel2:#f2f0ec; --ink:#1b1b19; --muted:#63605a; --line:#e0dcd6;
  --accent:#2f5d8a; --accent-ink:#ffffff;
  --s-built:#2e6b4c; --s-unwired:#a35f12; --s-designed:#6a5a86; --s-named:#7a4f8b; --s-gap:#ba1a1a; --s-later:#8c837e; --s-proposed:#1f6f8b;
  --chip:#fbfaf8; --shadow:0 1px 2px rgba(30,30,30,.08),0 8px 24px rgba(30,30,30,.10);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --ground:#151514; --dot:#2a2927; --panel:#1f1e1c; --panel2:#272522; --ink:#f2f0ec; --muted:#b3aea6; --line:#37342f;
  --accent:#8fbde8; --accent-ink:#0c2033;
  --s-built:#6fc59a; --s-unwired:#f0a54a; --s-designed:#b9a6e0; --s-named:#d3a7e0; --s-gap:#ff8a80; --s-later:#9d948f; --s-proposed:#6cc3e0;
  --chip:#1f1e1c; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.02em}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
.seg button[hidden]{display:none}
.zoom{display:flex;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:700}
.zoom button.wide{width:auto;padding:0 10px;font-size:12px}

.body{display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2);gap:2px}
.bars span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.stories{display:flex;flex-direction:column;gap:4px}
.story{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px}
.story:hover{background:var(--panel2)}
.story[aria-current="true"]{background:var(--panel2);border-color:var(--line)}
.story .num{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.story .t{font-weight:650;font-size:13.5px;line-height:1.3}
.story .m{grid-column:2;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.story .bars{height:5px}
.note{font-size:12px;line-height:1.5;color:var(--muted)}

main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.storyhead{padding:14px 20px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);background:var(--panel)}
.storyhead h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.02em}
.storyhead p{margin:0;color:var(--muted);max-width:70ch;line-height:1.45}
.viewport{flex:1;overflow:auto;position:relative;cursor:grab;
  background-color:var(--ground);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
.viewport.dragging{cursor:grabbing}
.stagewrap{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.elabel{position:absolute;transform:translate(-50%,-50%);max-width:140px;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:11px;line-height:1.3;text-align:center}
.elabel.missing{color:var(--s-gap);border-color:var(--s-gap)}
.launch{position:absolute;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:20px;background:var(--ink);color:var(--panel);transform:translateY(-50%)}
.lane{position:absolute;font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.lane b{color:var(--accent);margin-right:8px}

.node{position:absolute;width:360px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.node .cap{display:flex;align-items:center;gap:7px;height:22px;margin-bottom:8px;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .cap em{font-style:normal;color:var(--muted);font-weight:500}
.nodebox{display:flex;justify-content:center;filter:drop-shadow(0 8px 20px rgba(30,30,30,.14));transition:transform .15s ease}
.node:hover .nodebox{transform:translateY(-2px)}
.node[aria-pressed="true"] .nodebox{outline:3px solid var(--accent);outline-offset:6px;border-radius:12px}
.gapcard{width:300px;min-height:200px;border:2px dashed var(--s-gap);border-radius:22px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:10px}
.gapcard .q{font-size:40px;font-weight:800;color:var(--s-gap);line-height:1}
.gapcard p{margin:0;font-size:13px;line-height:1.45}

.play{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:24px;align-items:start;
  background-color:var(--ground);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
.playstage{display:flex;justify-content:center;padding-block:10px}
.playstage>div{transform:scale(1.35);transform-origin:top center}
.playstage [data-to]{cursor:pointer;transition:box-shadow .2s}
.playstage.flash [data-to]{box-shadow:0 0 0 2px var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:17px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;border:1px solid currentColor;width:max-content}
.ways{display:flex;flex-direction:column;gap:6px}
.ways button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:12.5px}
.ways button span{color:var(--muted);font-size:11.5px}
.trail{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px;color:var(--muted)}
.trail span+span::before{content:"\2192 "}

.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:340px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;z-index:5}
.drawer h2{margin:0;font-size:18px;letter-spacing:-.015em;padding-right:28px}
.drawer .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);font-size:11.5px;word-break:break-word}
.kv a{color:var(--accent)}
.drawer ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.45;font-size:13px}
.drawer .defect li{color:var(--s-gap)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;border-radius:9px;padding:9px 12px}

.sheet{flex:1;overflow:auto;padding:24px}
.sheet .inner{max-width:900px;display:flex;flex-direction:column;gap:22px}
.sheet .inner.wide{max-width:1180px}
.sheet h2{margin:0 0 8px;font-size:15px}
.item{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;margin-top:6px}
.item b{font-size:12.5px}.item p{margin:0;line-height:1.45;font-size:13px}
.kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.zone{display:flex;flex-direction:column;gap:6px}
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.ent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ent header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ent header b{font-family:var(--mono);font-size:13px}
.ent>p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.ent ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ent li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.4fr);gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:11.5px;align-items:baseline}
.ent li code{font-family:var(--mono);font-size:11px;word-break:break-word}
.ent li span{color:var(--muted)}.ent li em{font-style:normal;color:var(--muted)}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto}
  .body{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .stories{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .story{min-width:220px}
  main{min-height:80vh}
  .viewport{height:70vh;flex:none}
  .play{grid-template-columns:1fr;padding:16px}
  .playstage>div{transform:none}
  .seg{margin-left:0}
  .item{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* screen:start
   Everything that paints a screen lives between these two marks, and every colour, font, radius
   and space in here is a custom property the page writes from the tokens of the flows.json it was
   given. A literal value here would be this page's opinion about somebody else's product, so the
   test refuses one. */
.frame{font-family:var(--t-font-sans);color:var(--t-colour-ink);flex:none}
.frame-mobile{width:220px}
.frame-mobile .bezel{width:220px;height:452px;border-radius:30px;background:var(--t-colour-frame);padding:7px;position:relative}
.frame-mobile .notch{position:absolute;top:8px;left:50%;width:62px;height:17px;margin-left:-31px;border-radius:10px;background:var(--t-colour-frame);z-index:2}
.frame-mobile .screen{height:100%;border-radius:var(--t-radius-screen);padding-top:30px}
.frame-web{width:360px}
.frame-web .chrome{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--t-colour-line);border-bottom:0;
  border-radius:var(--t-radius-card) var(--t-radius-card) 0 0;background:var(--t-colour-surface-low)}
.frame-web .light{width:9px;height:9px;border-radius:50%;background:var(--t-colour-line);flex:none}
.frame-web .addr{flex:1;margin-left:6px;height:17px;border-radius:9px;background:var(--t-colour-surface);border:1px solid var(--t-colour-line);
  font-family:var(--t-font-mono);font-size:9px;line-height:15px;padding:0 8px;color:var(--t-colour-muted);overflow:hidden;white-space:nowrap}
.frame-web .screen{height:424px;border:1px solid var(--t-colour-line);border-top:0;border-radius:0 0 var(--t-radius-card) var(--t-radius-card)}
.screen{background:var(--t-colour-surface);color:var(--t-colour-ink);overflow:hidden;position:relative;display:flex;flex-direction:column;
  gap:var(--t-space-gap);padding:var(--t-space-pad);font-size:11px;line-height:1.35}
.screen.hasdock{padding-bottom:58px}
.screen .h{font-size:16px;font-weight:700;line-height:1.22;letter-spacing:-.02em}
.screen .p{font-size:10.5px;line-height:1.45;color:var(--t-colour-muted)}
.screen .eb{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t-colour-muted)}
.screen .card{background:var(--t-colour-surface-low);border-radius:var(--t-radius-card);padding:9px 10px;display:flex;flex-direction:column;gap:3px;
  font-size:10.5px;line-height:1.4;color:var(--t-colour-muted)}
.screen .card .k{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t-colour-primary)}
.screen .card .v{font-size:12px;font-weight:650;color:var(--t-colour-ink)}
.screen .btn{background:var(--t-colour-primary);color:var(--t-colour-on-primary);border-radius:var(--t-radius-control);padding:10px;
  text-align:center;font-weight:650;font-size:11.5px}
/* On a phone the last action sits at the bottom of the screen. In a browser it follows the shape
   above it, because a page scrolls and the bottom of the window is not the end of the form. */
.frame-mobile .screen .btn{margin-top:auto}
.frame-mobile .screen .btn~.btn,.frame-mobile .screen .btn~.btn2,.frame-mobile .screen .btn2~.btn{margin-top:0}
.screen .btn2{border:1.5px solid var(--t-colour-line);border-radius:var(--t-radius-control);padding:9px;text-align:center;font-weight:600;font-size:11.5px}
.screen .lnk{font-size:11px;font-weight:600;color:var(--t-colour-primary);text-align:center}
.screen .links{display:flex;justify-content:center;gap:14px}
.screen .top{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;color:var(--t-colour-muted)}
.screen .top .r{color:var(--t-colour-primary)}
.screen .input{border:1.5px solid var(--t-colour-line);border-radius:var(--t-radius-control);padding:6px 8px;font-family:var(--t-font-mono);
  font-size:9.5px;color:var(--t-colour-muted)}
.screen .fields{display:flex;flex-direction:column;gap:4px}
.screen .fields div{border:1.5px solid var(--t-colour-line);border-radius:var(--t-radius-control);padding:6px 8px;font-size:10px;color:var(--t-colour-muted)}
.screen .list{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--t-colour-muted)}
.screen .list div::before{content:"\00b7";margin-right:6px;color:var(--t-colour-primary);font-weight:800}
.screen .rows{display:flex;flex-direction:column;border-radius:var(--t-radius-card);background:var(--t-colour-surface-low);overflow:hidden}
.screen .rows div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;font-size:10.5px;font-weight:600;
  border-top:1px solid var(--t-colour-surface)}
.screen .rows div:first-child{border-top:0}
.screen .rows small{display:block;font-weight:500;color:var(--t-colour-muted);font-size:9.5px}
.screen .chips{display:flex;flex-wrap:wrap;gap:5px}
.screen .chips span{background:var(--t-colour-surface-low);border-radius:14px;padding:4px 9px;font-size:9.5px;font-weight:600}
.screen .opts{display:flex;flex-direction:column;gap:4px}
.screen .opts div{display:flex;align-items:center;gap:8px;font-size:10.5px;line-height:1.3;padding:7px 9px;border-radius:var(--t-radius-control);
  background:var(--t-colour-surface-low)}
.screen .opts div i{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--t-colour-line);background:var(--t-colour-surface)}
.screen .opts.multi div i{border-radius:3px}
.screen .opts div.on i{border-color:var(--t-colour-primary);background:var(--t-colour-primary)}
.screen .tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.screen .tiles div{background:var(--t-colour-surface-low);border-radius:var(--t-radius-card);padding:8px 7px;font-size:9.5px;font-weight:600;
  line-height:1.25;min-height:34px;display:flex;align-items:flex-end}
.screen .tiles div.on{box-shadow:inset 0 0 0 1.5px var(--t-colour-primary)}
.screen .stat{text-align:center;padding:6px 0}
.screen .stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--t-colour-primary)}
.screen .stat span{font-size:10px;color:var(--t-colour-muted);line-height:1.4}
.screen .quote{background:var(--t-colour-surface-low);border-radius:var(--t-radius-card);padding:9px 10px;font-size:10px;line-height:1.4;color:var(--t-colour-muted)}
.screen .quote b{display:block;color:var(--t-colour-ink);font-size:10.5px;margin-bottom:2px}
.screen .code{font-family:var(--t-font-mono);font-size:10px;line-height:1.6;background:var(--t-colour-surface-low);border-radius:var(--t-radius-card);padding:10px}
.screen .image{flex:1;min-height:52px;border:1.5px dashed var(--t-colour-line);border-radius:var(--t-radius-card);display:flex;align-items:center;
  justify-content:center;font-size:9.5px;color:var(--t-colour-muted)}
.screen .table{display:flex;flex-direction:column;border:1px solid var(--t-colour-line);border-radius:var(--t-radius-card);overflow:hidden;font-size:9.5px}
.screen .table div{display:flex;gap:8px;padding:6px 8px;border-top:1px solid var(--t-colour-line)}
.screen .table div:first-child{border-top:0;background:var(--t-colour-surface-low);font-weight:700}
.screen .table span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.screen .nav{display:flex;align-items:center;gap:12px;padding-bottom:6px;border-bottom:1px solid var(--t-colour-line);font-size:10px;font-weight:600;
  color:var(--t-colour-muted)}
.screen .nav span.on{color:var(--t-colour-primary)}
.screen .dock{position:absolute;left:0;right:0;bottom:0;height:50px;display:flex;background:var(--t-colour-surface);
  border-top:1px solid var(--t-colour-line);padding:6px 4px 10px}
.screen .dock div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8.5px;font-weight:600;color:var(--t-colour-muted)}
.screen .dock div i{width:16px;height:16px;border-radius:5px;background:var(--t-colour-surface-low)}
.screen .dock div.on{color:var(--t-colour-primary)}
.screen .dock div.on i{background:var(--t-colour-primary)}
.screen .spacer{flex:1}
/* screen:end */
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><b id="title">Flow map</b><span class="stamp" id="stamp"></span></div>
    <div class="seg" role="group" aria-label="View">
      <button id="m-map" aria-pressed="true">Map</button>
      <button id="m-play" aria-pressed="false">Prototype</button>
      <button id="m-gaps" aria-pressed="false">Gaps</button>
      <button id="m-data" aria-pressed="false" hidden>Data</button>
    </div>
    <div class="zoom" id="zoom">
      <button id="z-out" aria-label="Zoom out">&#8722;</button>
      <button id="z-fit" class="wide">Fit</button>
      <button id="z-in" aria-label="Zoom in">+</button>
    </div>
  </header>
  <div class="body">
    <aside>
      <section style="display:flex;flex-direction:column;gap:10px">
        <div class="label">Every screen</div>
        <div class="bars" id="allbar"></div>
        <div class="legend" id="legend"></div>
      </section>
      <section style="display:flex;flex-direction:column;gap:8px">
        <div class="label">User stories</div>
        <div class="stories" id="stories"></div>
      </section>
      <p class="note">Each frame is drawn from the words in flows.json, in the project's own tokens.
        These are not screenshots. Click a frame to read its source. Double click it to play from there.</p>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script id="flow-map-render">
// The renderer. It reads a screen and the tokens, and it answers with markup. It touches no
// document and no global state, so a test can run it outside a browser and read what an operator
// sees. Everything below the next script tag is the application around it.

var SCREEN_STATUS = {
  built: "Built, reachable",
  unwired: "Built, no route opens it",
  designed: "Designed, not built",
  named: "Named in a step, not designed",
  gap: "Open question",
  later: "After version 1",
  proposed: "Proposed, not decided"
};

// SURFACES are the two things a person looks at. A screen names one, and the name picks the frame.
var SURFACES = { mobile: "mobile", web: "web" };

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
}

// surfaceOf answers which frame a screen is drawn in. A screen that names neither is drawn on the
// phone, and the gaps view reports it, because a silent default is how a web page ends up in a
// phone and nobody sees it.
function surfaceOf(screen) {
  return screen && SURFACES[screen.surface] ? screen.surface : SURFACES.mobile;
}

// tokenStyle turns the tokens object into custom properties. It reads the groups it is given
// rather than a list written here, so a project can carry more tokens than this page draws with.
// A name or a value that could break out of the style attribute is left out.
function tokenStyle(tokens) {
  var safeName = /^[a-z0-9-]+$/i, out = [];
  Object.keys(tokens || {}).forEach(function (group) {
    var set = tokens[group];
    if (!set || typeof set !== "object" || !safeName.test(group)) { return; }
    Object.keys(set).forEach(function (name) {
      var value = String(set[name]);
      if (!safeName.test(name) || /[;"<>]/.test(value)) { return; }
      out.push("--t-" + group + "-" + name + ":" + value);
    });
  });
  return out.join(";");
}

function hot(to) { return to ? ' data-to="' + esc(to) + '"' : ""; }

// named puts the component an element stands for on the element itself, so a person reading the
// mockup can hover it and a build can read which component goes where.
function named(e) {
  return e && e.component ? ' data-component="' + esc(e.component) + '" title="' + esc(e.component) + '"' : "";
}

function box(cls, e, inner, extra) {
  return '<div class="' + cls + '"' + named(e) + (extra || "") + ">" + inner + "</div>";
}

function lines(values) {
  return (values || []).map(function (v) { return esc(v); });
}

function renderEl(e) {
  switch (e.t) {
    case "h": return box("h", e, esc(e.v));
    case "p": return box("p", e, esc(e.v));
    case "eyebrow": return box("eb", e, esc(e.v));
    case "top": return box("top", e, "<span>" + esc(e.v) + "</span><span class=\"r\"" + hot(e.to) + ">" + esc(e.right) + "</span>");
    case "card": return box("card", e, (e.v || []).length > 1
      ? '<span class="k">' + esc(e.v[0]) + "</span>" + e.v.slice(1).map(function (l, i) {
        return '<span class="' + (i === 0 ? "v" : "") + '">' + esc(l) + "</span>";
      }).join("")
      : "<span>" + esc((e.v || [])[0]) + "</span>");
    case "btn": return box("btn", e, esc(e.v), hot(e.to));
    case "btn2": return box("btn2", e, esc(e.v), hot(e.to));
    case "link": return box("lnk", e, esc(e.v), hot(e.to));
    case "links": return box("links", e, (e.v || []).map(function (l) {
      return '<span class="lnk"' + hot(l.to) + ">" + esc(l.v) + "</span>";
    }).join(""));
    case "input": return box("input", e, esc(e.v));
    case "fields": return box("fields", e, lines(e.v).map(function (f) { return "<div>" + f + "</div>"; }).join(""));
    case "list": return box("list", e, lines(e.v).map(function (l) { return "<div>" + l + "</div>"; }).join(""));
    case "rows": return box("rows", e, (e.v || []).map(function (r) {
      return "<div" + hot(r.to) + "><span>" + esc(r.v) + (r.sub ? "<small>" + esc(r.sub) + "</small>" : "") + "</span></div>";
    }).join(""));
    case "chips": return box("chips", e, lines(e.v).map(function (c) { return "<span>" + c + "</span>"; }).join(""));
    case "opts": return box("opts" + (e.multi ? " multi" : ""), e, (e.v || []).map(function (o, i) {
      return '<div class="' + ((e.on || []).indexOf(i) >= 0 ? "on" : "") + '"' + hot(o && o.to) + "><i></i>" + esc(o && o.v !== undefined ? o.v : o) + "</div>";
    }).join(""));
    case "tiles": return box("tiles", e, (e.v || []).map(function (o, i) {
      return '<div class="' + ((e.on || []).indexOf(i) >= 0 ? "on" : "") + '">' + esc(o) + "</div>";
    }).join(""));
    case "stat": return box("stat", e, "<b>" + esc(e.v) + "</b><span>" + esc(e.sub) + "</span>");
    case "quote": return box("quote", e, "<b>" + esc(e.v) + "</b>" + esc(e.sub));
    case "code": return box("code", e, esc(e.v));
    case "image": return box("image", e, esc(e.v));
    case "table": return box("table", e, "<div>" + lines(e.head).map(function (h) { return "<span>" + h + "</span>"; }).join("") + "</div>" +
      (e.rows || []).map(function (row) {
        return "<div>" + lines(row).map(function (cell) { return "<span>" + cell + "</span>"; }).join("") + "</div>";
      }).join(""));
    case "nav": return box("nav", e, (e.v || []).map(function (n) {
      return '<span class="' + (n.v === e.active ? "on" : "") + '"' + hot(n.to) + ">" + esc(n.v) + "</span>";
    }).join(""));
    case "dock": return box("dock", e, (e.v || []).map(function (n) {
      return '<div class="' + (n.v === e.active ? "on" : "") + '"' + hot(n.to) + "><i></i>" + esc(n.v) + "</div>";
    }).join(""));
    case "spacer": return box("spacer", e, "");
    default: return "";
  }
}

function renderElements(screen) {
  return ((screen && screen.el) || []).map(renderEl).join("");
}

// renderScreen draws one screen inside the frame its surface asks for: a phone for mobile, a
// browser with an address bar for web. The tokens ride on the frame as custom properties, so every
// colour and font below it is the project's own.
function renderScreen(screen, tokens) {
  var surface = surfaceOf(screen);
  var hasDock = (((screen && screen.el) || []).some(function (e) { return e.t === "dock"; })) ? " hasdock" : "";
  var style = ' style="' + tokenStyle(tokens) + '"';
  var inside = '<div class="screen' + hasDock + '">' + renderElements(screen) + "</div>";
  if (surface === SURFACES.web) {
    return '<div class="frame frame-web" data-surface="web"' + style + '>' +
      '<div class="chrome"><i class="light"></i><i class="light"></i><i class="light"></i>' +
      '<span class="addr">' + esc((screen && screen.route) || "/") + "</span></div>" + inside + "</div>";
  }
  return '<div class="frame frame-mobile" data-surface="mobile"' + style + '>' +
    '<div class="bezel"><i class="notch"></i>' + inside + "</div></div>";
}
</script>

<script>
// The application: the four views, the story picker, and the fetch that starts it.
var NODE_W = 360, NODE_H = 452, CAP = 30, COL = 470, ROW = 610, PAD_X = 140, PAD_TOP = 150, PAD_BOTTOM = 120;
var EDGE = { built: "built", designed: "designed", named: "named", missing: "gap", later: "later", proposed: "proposed" };

var DATA, mode = "map", storyId, zoom = 1, selected = null, playTrail = [];
var $ = function (s, r) { return (r || document).querySelector(s); };
var col = function (s) { return "var(--s-" + s + ")"; };
var remember = function (k, v) { try { localStorage.setItem("flow-map-" + k, v); } catch (e) { /* storage is optional */ } };
var recall = function (k) { try { return localStorage.getItem("flow-map-" + k); } catch (e) { return null; } };

function screenOf(id) { return DATA.screens[id] || { name: id, status: "gap", q: "No screen with this name is in flows.json." }; }
function frameOf(s) { return s.status === "gap" ? renderGap(s) : renderScreen(s, DATA.tokens); }
function renderGap(s) { return '<div class="gapcard"><div class="q">?</div><b>' + esc(s.name) + "</b><p>" + esc(s.q) + "</p></div>"; }

function counts(ids) {
  var c = {};
  ids.forEach(function (id) { var st = screenOf(id).status; c[st] = (c[st] || 0) + 1; });
  return c;
}
function barHtml(c) {
  return Object.keys(SCREEN_STATUS).filter(function (k) { return c[k]; }).map(function (k) {
    return '<span style="flex:' + c[k] + ";background:" + col(k) + '" title="' + esc(SCREEN_STATUS[k]) + ": " + c[k] + '"></span>';
  }).join("");
}
function renderAside() {
  var all = counts(Object.keys(DATA.screens));
  $("#allbar").innerHTML = barHtml(all);
  $("#legend").innerHTML = Object.keys(SCREEN_STATUS).map(function (k) {
    return '<div><i class="dot" style="background:' + col(k) + '"></i>' + esc(SCREEN_STATUS[k]) + "</div><output>" + (all[k] || 0) + "</output>";
  }).join("");
  $("#stories").innerHTML = DATA.stories.map(function (st, i) {
    var ids = DATA.stories[i].nodes.map(function (n) { return n[0]; }).filter(function (v, at, list) { return list.indexOf(v) === at; });
    return '<button class="story" data-story="' + esc(st.id) + '" aria-current="' + (st.id === storyId) + '">' +
      '<span class="num">' + (i + 1) + '</span><span class="t">' + esc(st.title) + "</span>" +
      '<span class="m"><span>' + esc(st.steps || (ids.length + " screens")) + '</span><span class="bars">' + barHtml(counts(ids)) + "</span></span></button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".story"), function (b) {
    b.onclick = function () { selectStory(b.dataset.story); };
  });
}

function storyNow() {
  var found = DATA.stories.filter(function (s) { return s.id === storyId; });
  return found.length ? found[0] : DATA.stories[0];
}
function nodePos(n) { return { x: PAD_X + n[1] * COL, y: PAD_TOP + n[2] * ROW }; }
function edgePath(a, b) {
  var A = { l: a.x, r: a.x + NODE_W, t: a.y + CAP, b: a.y + CAP + NODE_H, cx: a.x + NODE_W / 2, cy: a.y + CAP + NODE_H / 2 };
  var B = { l: b.x, r: b.x + NODE_W, t: b.y + CAP, b: b.y + CAP + NODE_H, cx: b.x + NODE_W / 2, cy: b.y + CAP + NODE_H / 2 };
  var dc = Math.round((b.x - a.x) / COL), sameRow = a.y === b.y;
  if (sameRow && (dc > 1 || dc < 0)) {
    var lift = 70 + Math.abs(dc) * 12, y = A.t - CAP - lift;
    return { d: "M" + A.cx + " " + (A.t - CAP - 4) + " C" + A.cx + " " + y + ", " + B.cx + " " + y + ", " + B.cx + " " + (B.t - CAP - 6), mx: (A.cx + B.cx) / 2, my: y + lift * 0.25 };
  }
  if (dc > 0) {
    var k = (B.l - A.r) / 2;
    return { d: "M" + A.r + " " + A.cy + " C" + (A.r + k) + " " + A.cy + ", " + (B.l - k) + " " + B.cy + ", " + (B.l - 4) + " " + B.cy, mx: (A.r + B.l) / 2, my: (A.cy + B.cy) / 2 };
  }
  if (dc === 0) {
    var down = b.y > a.y, y1 = down ? A.b : A.t - CAP, y2 = down ? B.t - CAP - 6 : B.b + 6;
    return { d: "M" + A.cx + " " + y1 + " L" + B.cx + " " + y2, mx: A.cx, my: (y1 + y2) / 2 };
  }
  if (b.y > a.y) {
    var mid = A.b + 26, x = B.l - 40;
    return { d: "M" + A.cx + " " + A.b + " L" + A.cx + " " + mid + " L" + x + " " + mid + " L" + x + " " + B.cy + " L" + (B.l - 4) + " " + B.cy, mx: (A.cx + x) / 2, my: mid };
  }
  var yy = Math.max(A.b, B.b) + 80;
  return { d: "M" + A.cx + " " + A.b + " C" + A.cx + " " + yy + ", " + B.cx + " " + yy + ", " + B.cx + " " + (B.b + 6), mx: (A.cx + B.cx) / 2, my: yy - 20 };
}
function renderMap() {
  var st = storyNow(), main = $("#main");
  var maxC = Math.max.apply(null, st.nodes.map(function (n) { return n[1]; }));
  var maxR = Math.max.apply(null, st.nodes.map(function (n) { return n[2]; }));
  var sw = PAD_X * 2 + maxC * COL + NODE_W, sh = PAD_TOP + maxR * ROW + CAP + NODE_H + PAD_BOTTOM;
  var pos = {};
  st.nodes.forEach(function (n) { pos[n[0]] = nodePos(n); });
  var markers = Object.keys(EDGE).map(function (name) {
    var k = EDGE[name];
    return '<marker id="ar-' + k + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + col(k) + '"/></marker>';
  }).join("");
  var svg = '<svg class="edges" width="' + sw + '" height="' + sh + '"><defs>' + markers + "</defs>", labels = "";
  (st.edges || []).forEach(function (e) {
    var from = pos[e[0]], to = pos[e[1]];
    if (!from || !to) { return; }
    var p = edgePath(from, to), k = EDGE[e[3]] || "built";
    var dash = { built: "", designed: "7 6", named: "2 5", gap: "5 5", later: "7 6", proposed: "3 4" }[k];
    svg += '<path d="' + p.d + '" fill="none" stroke="' + col(k) + '" stroke-width="' + (k === "built" ? 2.2 : 2) + '" ' +
      (dash ? 'stroke-dasharray="' + dash + '" ' : "") + 'marker-end="url(#ar-' + k + ')"/>';
    labels += '<div class="elabel ' + (e[3] === "missing" ? "missing" : "") + '" style="left:' + p.mx + "px;top:" + p.my + 'px">' + esc(e[2]) + "</div>";
  });
  svg += "</svg>";
  var s0 = pos[st.start] || pos[st.nodes[0][0]];
  var lanes = (st.lanes || []).map(function (t, r) {
    return '<div class="lane" style="left:' + PAD_X + "px;top:" + (PAD_TOP + r * ROW - (r ? 62 : 44)) + 'px"><b>' + (r + 1) + "</b>" + esc(t) + "</div>";
  }).join("");
  var nodes = st.nodes.map(function (n) {
    var id = n[0], s = screenOf(id), p = pos[id];
    return '<button class="node" data-id="' + esc(id) + '" style="left:' + p.x + "px;top:" + p.y + 'px" aria-pressed="' + (selected === id) + '" ' +
      'aria-label="' + esc(s.name) + ", " + esc(SCREEN_STATUS[s.status] || s.status) + '">' +
      '<div class="cap"><i class="dot" style="background:' + col(s.status) + '"></i>' + esc(s.name) +
      "<em>" + esc(surfaceOf(s)) + "</em></div>" +
      '<div class="nodebox">' + frameOf(s) + "</div></button>";
  }).join("");
  main.innerHTML = '<div class="storyhead"><h1>' + esc(st.title) + "</h1><p>" + esc(st.story) + "</p></div>" +
    '<div class="viewport" id="vp"><div class="stagewrap" id="wrap"><div class="stage" id="stage" style="width:' + sw + "px;height:" + sh + 'px">' +
    svg + labels + '<div class="launch" style="left:' + (s0.x - 92) + "px;top:" + (s0.y + CAP + NODE_H / 2) + 'px">start &#8594;</div>' + lanes + nodes + "</div></div></div>";
  main.dataset.sw = sw; main.dataset.sh = sh;
  Array.prototype.forEach.call(main.querySelectorAll(".node"), function (n) {
    n.onclick = function () { openDrawer(n.dataset.id); };
    n.ondblclick = function () { playTrail = [n.dataset.id]; setMode("play"); };
  });
  enablePan($("#vp"));
  if (selected && st.nodes.some(function (n) { return n[0] === selected; })) { openDrawer(selected); } else { selected = null; }
  fit();
}
function applyZoom() {
  var m = $("#main"), st = $("#stage"), wr = $("#wrap");
  if (!st) { return; }
  st.style.transform = "scale(" + zoom + ")";
  wr.style.width = m.dataset.sw * zoom + "px";
  wr.style.height = m.dataset.sh * zoom + "px";
}
function fit() {
  var vp = $("#vp"); if (!vp) { return; }
  var m = $("#main");
  var rows = Math.round((m.dataset.sh - PAD_TOP - CAP - NODE_H - PAD_BOTTOM) / ROW) + 1;
  zoom = rows > 2
    ? Math.max(0.3, Math.min(1, (vp.clientWidth - 8) / m.dataset.sw))
    : Math.max(0.4, Math.min(1, (vp.clientHeight - 8) / m.dataset.sh));
  applyZoom();
}
var panState = null;
function enablePan(vp) {
  vp.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".node,.drawer")) { return; }
    panState = { vp: vp, sx: e.clientX, sy: e.clientY, sl: vp.scrollLeft, st: vp.scrollTop };
    vp.classList.add("dragging");
  });
}
window.addEventListener("pointermove", function (e) {
  if (!panState) { return; }
  panState.vp.scrollLeft = panState.sl - (e.clientX - panState.sx);
  panState.vp.scrollTop = panState.st - (e.clientY - panState.sy);
});
window.addEventListener("pointerup", function () {
  if (panState) { panState.vp.classList.remove("dragging"); }
  panState = null;
});

function sourceLinks(src) {
  if (!src) { return "none"; }
  var repo = (DATA.readAt && DATA.readAt.repository) || "";
  var commit = (DATA.readAt && DATA.readAt.commit) || "main";
  return src.split(", ").map(function (p) {
    if (!repo) { return esc(p); }
    return '<a href="' + esc(repo) + "/blob/" + esc(commit) + "/" + esc(p) + '" target="_blank" rel="noopener">' + esc(p) + "</a>";
  }).join("<br>");
}
function ways(id) {
  var out = [];
  DATA.stories.forEach(function (st) {
    (st.edges || []).forEach(function (e) {
      if (e[0] === id && !out.some(function (o) { return o.t === e[1] && o.label === e[2]; })) {
        out.push({ t: e[1], label: e[2], kind: e[3] });
      }
    });
  });
  return out;
}
function openDrawer(id) {
  selected = id;
  var s = screenOf(id);
  Array.prototype.forEach.call(document.querySelectorAll(".node"), function (n) {
    n.setAttribute("aria-pressed", String(n.dataset.id === id));
  });
  var old = $(".drawer"); if (old) { old.remove(); }
  var d = document.createElement("div");
  d.className = "drawer";
  d.innerHTML = '<button class="x" aria-label="Close">&#215;</button><h2>' + esc(s.name) + "</h2>" +
    '<span class="pill" style="color:' + col(s.status) + '"><i class="dot" style="background:' + col(s.status) + '"></i>' + esc(SCREEN_STATUS[s.status] || s.status) + "</span>" +
    '<dl class="kv"><dt>Surface</dt><dd>' + esc(surfaceOf(s)) + "</dd><dt>Route</dt><dd>" + esc(s.route || "none") +
    "</dd><dt>Source</dt><dd>" + sourceLinks(s.source) + "</dd><dt>Builds</dt><dd>" + esc(s.ref || "none") + "</dd></dl>" +
    (s.q ? '<p style="margin:0;line-height:1.5">' + esc(s.q) + "</p>" : "") +
    ((s.defects || []).length ? '<div><div class="label" style="color:var(--s-gap)">What is missing</div><ul class="defect">' +
      s.defects.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" : "") +
    ((s.notes || []).length ? '<div><div class="label">Notes</div><ul>' +
      s.notes.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" : "") +
    (ways(id).length ? '<div><div class="label">Ways out</div><ul>' + ways(id).map(function (w) {
      return "<li>" + esc(w.label) + " &#8594; " + esc(screenOf(w.t).name) + "</li>";
    }).join("") + "</ul></div>" : "") +
    (s.status !== "gap" ? '<button class="primary">Play from this screen</button>' : "");
  $("#main").appendChild(d);
  d.querySelector(".x").onclick = function () {
    d.remove(); selected = null;
    Array.prototype.forEach.call(document.querySelectorAll(".node"), function (n) { n.setAttribute("aria-pressed", "false"); });
  };
  var p = d.querySelector(".primary");
  if (p) { p.onclick = function () { playTrail = [id]; setMode("play"); }; }
}

function renderPlay() {
  var st = storyNow();
  if (!playTrail.length) { playTrail = [st.start]; }
  var id = playTrail[playTrail.length - 1], s = screenOf(id), w = ways(id);
  $("#main").innerHTML = '<div class="storyhead"><h1>' + esc(st.title) + "</h1><p>Press the frame the way a person would. Press an empty spot to flash what can be pressed.</p></div>" +
    '<div class="play"><div class="playstage" id="pp">' + frameOf(s) + "</div>" +
    '<div class="panel"><h2>' + esc(s.name) + "</h2>" +
    '<span class="pill" style="color:' + col(s.status) + '"><i class="dot" style="background:' + col(s.status) + '"></i>' + esc(SCREEN_STATUS[s.status] || s.status) + "</span>" +
    '<div class="note">' + esc(surfaceOf(s)) + " &#183; " + esc(s.route || "no route") + "</div>" +
    ((s.defects || []).length ? '<p class="note" style="color:var(--s-gap);margin:0">' + esc(s.defects[0]) + "</p>" : "") +
    (w.length ? '<div class="ways"><div class="label">Ways out</div>' + w.map(function (x) {
      return '<button data-go="' + esc(x.t) + '">' + esc(x.label) + "<span>" + esc(screenOf(x.t).name) + "</span></button>";
    }).join("") + "</div>" : "") +
    '<div style="display:flex;gap:8px"><button class="primary" id="pb"' + (playTrail.length < 2 ? ' disabled style="opacity:.4"' : "") + ">Back</button>" +
    '<button class="primary" id="pr" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line)">Restart story</button></div>' +
    '<div><div class="label" style="margin-bottom:6px">Trail</div><div class="trail">' +
    playTrail.map(function (t) { return "<span>" + esc(screenOf(t).name) + "</span>"; }).join("") + "</div></div></div></div>";
  var pp = $("#pp");
  pp.onclick = function (e) {
    var h = e.target.closest("[data-to]");
    if (!h) { pp.classList.add("flash"); setTimeout(function () { pp.classList.remove("flash"); }, 600); return; }
    go(h.dataset.to);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
    b.onclick = function () { go(b.dataset.go); };
  });
  $("#pb").onclick = function () { if (playTrail.length > 1) { playTrail.pop(); renderPlay(); } };
  $("#pr").onclick = function () { playTrail = []; renderPlay(); };
}
function go(to) {
  if (to === "back") { if (playTrail.length > 1) { playTrail.pop(); } renderPlay(); return; }
  if (DATA.screens[to]) { playTrail.push(to); renderPlay(); }
}

function renderGaps() {
  var rows = [];
  Object.keys(DATA.screens).forEach(function (id) {
    var s = DATA.screens[id];
    (s.defects || []).forEach(function (x) { rows.push({ id: id, kind: "Missing", c: "gap", t: x }); });
    if (s.status === "gap") { rows.push({ id: id, kind: "Question", c: "gap", t: s.q }); }
    if (s.status === "unwired") { rows.push({ id: id, kind: "Not reachable", c: "unwired", t: s.name + " is built. No route opens it." }); }
    if (s.status === "named") { rows.push({ id: id, kind: "Not designed", c: "named", t: s.name + " is named in " + (s.ref || "a step") + ". No screen design exists." }); }
    if (!SURFACES[s.surface]) { rows.push({ id: id, kind: "No surface", c: "gap", t: s.name + " names no surface, so it is drawn on a phone." }); }
    (s.el || []).forEach(function (e) {
      if (!e.component) { rows.push({ id: id, kind: "No component", c: "named", t: "A " + e.t + " on " + s.name + " names no component." }); }
    });
  });
  var seen = {};
  var groups = DATA.stories.map(function (st) {
    return {
      st: st,
      items: rows.filter(function (r) { return st.nodes.some(function (n) { return n[0] === r.id; }); }).filter(function (r) {
        var k = r.id + r.t;
        if (seen[k]) { return false; }
        seen[k] = true;
        return true;
      })
    };
  }).filter(function (g) { return g.items.length; });
  $("#main").innerHTML = '<div class="storyhead"><h1>What is missing</h1><p>Every defect, open question, unreachable screen and unnamed component, by user story. A screen in two stories is listed under the first.</p></div>' +
    '<div class="sheet"><div class="inner">' + (groups.length ? groups.map(function (g) {
      return "<section><h2>" + esc(g.st.title) + "</h2>" + g.items.map(function (r) {
        return '<button class="item" data-story="' + esc(g.st.id) + '" data-id="' + esc(r.id) + '"><span class="kind" style="color:' + col(r.c) + '">' + r.kind +
          "</span><div><b>" + esc(screenOf(r.id).name) + "</b><p>" + esc(r.t) + "</p></div></button>";
      }).join("") + "</section>";
    }).join("") : '<p class="note">Nothing is missing on any story in this map.</p>') + "</div></div>";
  Array.prototype.forEach.call(document.querySelectorAll(".sheet .item"), function (b) {
    b.onclick = function () { selected = b.dataset.id; storyId = b.dataset.story; setMode("map"); };
  });
}

function renderData() {
  var dm = DATA.dataModel;
  var table = function (t) {
    return '<article class="ent"><header><b>' + esc(t.name) + '</b><span class="pill" style="color:' + col(t.status === "proposed" ? "proposed" : t.status === "designed" ? "designed" : "built") + '">' + esc(t.status) + "</span></header>" +
      "<p>" + esc(t.role) + "</p><ul>" + (t.fields || []).map(function (f) {
        return "<li><code>" + esc(f[0]) + "</code><span>" + esc(f[1]) + "</span><em>" + esc(f[2]) + "</em></li>";
      }).join("") + "</ul></article>";
  };
  $("#main").innerHTML = '<div class="storyhead"><h1>Where the data lives</h1><p>' + esc(dm.intro) + "</p></div>" +
    '<div class="sheet"><div class="inner wide">' + (dm.zones || []).map(function (z) {
      return '<section class="zone"><h2>' + esc(z.title) + '</h2><p class="note">' + esc(z.sub) + '</p><div class="ents">' + (z.tables || []).map(table).join("") + "</div></section>";
    }).join("") +
    ((dm.decisions || []).length ? "<section><h2>Decisions for you</h2>" + dm.decisions.map(function (x, i) {
      return '<div class="item"><span class="kind" style="color:' + col("gap") + '">Decision ' + (i + 1) + "</span><div><p>" + esc(x) + "</p></div></div>";
    }).join("") + "</section>" : "") + "</div></div>";
}

function setMode(m) {
  mode = m; remember("mode", m);
  ["map", "play", "gaps", "data"].forEach(function (k) { $("#m-" + k).setAttribute("aria-pressed", String(k === m)); });
  $("#zoom").hidden = m !== "map";
  renderAside();
  if (m === "map") { renderMap(); } else if (m === "play") { renderPlay(); } else if (m === "data") { renderData(); } else { renderGaps(); }
}
function selectStory(id) {
  storyId = id; remember("story", id); playTrail = []; selected = null;
  history.replaceState(null, "", "#" + id);
  setMode(mode === "gaps" || mode === "data" ? "map" : mode);
}
$("#m-map").onclick = function () { setMode("map"); };
$("#m-play").onclick = function () { playTrail = []; setMode("play"); };
$("#m-gaps").onclick = function () { setMode("gaps"); };
$("#m-data").onclick = function () { setMode("data"); };
$("#z-in").onclick = function () { zoom = Math.min(1.6, zoom + 0.15); applyZoom(); };
$("#z-out").onclick = function () { zoom = Math.max(0.25, zoom - 0.15); applyZoom(); };
$("#z-fit").onclick = fit;
window.addEventListener("resize", function () { if (mode === "map") { fit(); } });

// The screens come from the stage this page is opened at, which is one step above the page. The
// site serves the page at <stage>/map/ and the screens at <stage>/flows.json, so a project keeps
// its screens in the system that holds the rest of its design and publishes nothing.
fetch("../flows.json").then(function (r) {
  if (!r.ok) { throw new Error("the screens answered " + r.status); }
  return r.json();
}).then(function (d) {
  DATA = d;
  $("#title").textContent = (d.project ? d.project + " " : "") + "flow map";
  document.title = $("#title").textContent;
  $("#stamp").textContent = d.readAt ? "read from " + d.readAt.commit + " · " + d.readAt.date : "";
  $("#m-data").hidden = !d.dataModel;
  var hash = location.hash.slice(1);
  var known = function (id) { return d.stories.some(function (s) { return s.id === id; }); };
  storyId = known(hash) ? hash : (known(recall("story")) ? recall("story") : d.stories[0].id);
  var m = recall("mode");
  mode = ["map", "play", "gaps", "data"].indexOf(m) >= 0 ? m : "map";
  if (mode === "data" && !d.dataModel) { mode = "map"; }
  setMode(mode);
}).catch(function (err) {
  $("#main").innerHTML = '<p style="padding:24px">The flow data did not load: ' + esc(err.message) + ". Reload the page.</p>";
});
</script>
